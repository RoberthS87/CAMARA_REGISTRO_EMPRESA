<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara de Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #121212; color: white; text-align: center; padding: 15px; }
    video, canvas { width: 100%; max-width: 480px; border-radius: 12px; background: #000; }
  </style>
</head>
<body>

  <h5 class="mb-3">Captura de Fotografía</h5>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="mt-3">
    <button id="btnFoto" class="btn btn-success btn-lg w-100" onclick="tomarFoto()">📸 Capturar y Guardar</button>
  </div>

  <script>
    let video = document.getElementById('webcam');

    // Iniciar cámara web directamente (Tu código rápido original)
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { alert("Permita el acceso a la cámara en su navegador."); });

    function tomarFoto() {
      let canvas = document.getElementById('canvas');
      let ctx = canvas.getContext('2d');
      
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      
      // 1. Tomar la foto de la cámara al instante
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 2. Generar textos de fecha y hora exacta con milisegundos
      let ahora = new Date();
      let fecha = ahora.toLocaleDateString('es-ES', { year: 'numeric', month: '2-digit', day: '2-digit' });
      let hora = ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      let ms = String(ahora.getMilliseconds()).padStart(3, '0');
      let marcaDeTiempo = `${fecha}  ${hora}.${ms}`;
      
      // 3. Dibujar fondo negro sutil abajo para que la hora resalte (Proporcional a la foto)
      let altoBarra = Math.round(canvas.height * 0.08);
      ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
      ctx.fillRect(0, canvas.height - altoBarra, canvas.width, altoBarra);
      
      // 4. Inyectar la estampa temporal en color verde fosforescente de seguridad
      let tamañoFuente = Math.round(canvas.height * 0.04);
      ctx.fillStyle = "#00ff00"; 
      ctx.font = `bold ${tamañoFuente}px monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(marcaDeTiempo, canvas.width / 2, canvas.height - (altoBarra / 2));
      
      // 5. Convertir a imagenBase64 (Tu código original)
      let fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);

      // Enviar la foto capturada de regreso a la ventana principal de Google Apps Script
      if (window.opener) {
        window.opener.postMessage({ tipo: 'FOTO_CAPTURADA', foto: fotoBase64 }, '*');
        window.close();
      } else {
        alert("Foto capturada correctamente.");
      }
    }
  </script>
</body>
</html>
